services:
  postgres:
    image: postgres:16
    container_name: etf_dss_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etf_dss}
      POSTGRES_USER: ${POSTGRES_USER:-etf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - etf_dss_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  etf_dss_postgres_data:
